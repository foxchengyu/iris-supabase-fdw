name: Build and Release Wasm FDW

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Install cargo-component
        run: cargo install cargo-component --locked --version 0.21.1

      - name: Build Wasm package
        run: cargo component build --release --target wasm32-unknown-unknown 2>&1 | tee build.log
        working-directory: iris-fdw-wasm

      - name: Publish build log on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '(no build.log found)';
            try { log = fs.readFileSync('iris-fdw-wasm/build.log', 'utf8'); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI debug] build log ${context.ref}`,
              body: '```\n' + log.slice(-50000) + '\n```'
            });

      - name: Calculate checksum
        id: checksum
        run: |
          set -o pipefail
          {
            echo "== wasm artifacts in target =="
            find iris-fdw-wasm/target -type f -name '*.wasm' || true
          } 2>&1 | tee -a iris-fdw-wasm/build.log
          WASM=$(find iris-fdw-wasm/target -type f -name '*.wasm' | head -1)
          if [ -z "$WASM" ]; then echo "ERROR: wasm artifact not found"; exit 1; fi
          echo "wasm_file=$WASM" >> $GITHUB_OUTPUT
          CHECKSUM=$(sha256sum "$WASM" | cut -d' ' -f1)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.checksum.outputs.wasm_file }}
          body: |
            ## iris_fdw.wasm v${{ steps.checksum.outputs.version }}

            InterSystems IRIS Foreign Data Wrapper for Supabase.

            ### Installation

            ```sql
            create extension if not exists wrappers with schema extensions;
            create foreign data wrapper wasm_wrapper
              handler wasm_fdw_handler
              validator wasm_fdw_validator;

            create server iris_server
              foreign data wrapper wasm_wrapper
              options (
                fdw_package_url '${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/iris_fdw.wasm',
                fdw_package_name 'iris:iris-fdw',
                fdw_package_version '${{ steps.checksum.outputs.version }}',
                fdw_package_checksum '${{ steps.checksum.outputs.checksum }}',
                api_url 'https://your-iris-host/iris-fdw/v1',
                username 'fdw_user',
                password_id '<vault-secret-id>'
              );

            create schema if not exists iris;
            import foreign schema "MySchema" from server iris_server into iris;
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}